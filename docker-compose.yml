version: '3.8'

services:
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: edusense-ml-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edusense-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - ML_SERVICE_URL=http://ml-service:8000
      - JWT_SECRET=edusense_super_secret_jwt_key_2026_academic_system
      - LLM_PROVIDER=groq
      - LLM_MODEL=llama-3.3-70b-versatile
      - LLM_API_KEY=${LLM_API_KEY}
    depends_on:
      - ml-service
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edusense-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    depends_on:
      - backend
    restart: unless-stopped
